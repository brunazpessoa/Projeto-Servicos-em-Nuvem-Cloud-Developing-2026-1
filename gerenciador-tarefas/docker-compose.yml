version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tarefas-banco
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tarefas_db
    ports:
      - "5432:5432"
    volumes:
      - database_tasks:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tarefas-api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_NAME=tarefas_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: tarefas-tela
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  database_tasks: