version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tarefas-banco
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tarefas_db
    ports:
      - "5432:5432"
    volumes:
      - database_tasks:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql   # ← inicializa o banco automaticamente
    # Healthcheck: garante que o Postgres esteja aceitando conexões antes do backend subir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tarefas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tarefas-api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password123
      - DB_NAME=tarefas_db
      - PORT=3000
    # Só sobe depois que o banco estiver saudável (healthcheck passou)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tarefas-tela
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  database_tasks:
